name: Daily Flare SEO Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m daily_flare_seo --url https://thedailyflare.com --max-pages 100 --output report.json
      - uses: actions/upload-artifact@v4
        with:
          name: daily-flare-seo-report
          path: report.json
